name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, test, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install z3 (lib for the SMT operators, issues #115-#116)
        run: sudo apt-get update && sudo apt-get install -y libz3-dev

      - name: Check compilation
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  corpus:
    name: Selftest corpus extraction
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unit-test the extractor
        run: python3 -m unittest discover -s tools/tests -v

      - name: Sparse-checkout the pinned bpf-next selftests
        # tools/selftest-corpus.lock pins the commit and the expected
        # program count/catalog hash (#138).  The extractor only needs
        # tools/include, tools/lib and the verifier fragments (~5 MB),
        # so a blobless sparse clone keeps the job fast.
        run: |
          git init -q /tmp/bpf-next
          cd /tmp/bpf-next
          git remote add origin https://git.kernel.org/pub/scm/linux/kernel/git/bpf/bpf-next.git
          git fetch -q --depth 1 --filter=blob:none origin a30c772627b2ef4bc715332b1b04938a914556cd
          git sparse-checkout init --cone
          git sparse-checkout set tools/include tools/lib tools/testing/selftests/bpf/verifier
          git checkout -q FETCH_HEAD

      - name: Extract and verify the corpus lock
        run: python3 tools/selftest_corpus.py --tree /tmp/bpf-next --out /tmp/selftest-corpus --check-lock

      - name: Upload the corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: selftest-corpus
          path: /tmp/selftest-corpus/
          if-no-files-found: error

  replay:
    name: Selftest corpus replay
    needs: corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Download the pinned corpus
        uses: actions/download-artifact@v4
        with:
          name: selftest-corpus
          path: /tmp/selftest-corpus

      - name: Build the replay tool
        run: cargo build --release --bin replay

      - name: Replay the corpus against the committed baseline
        # Fails only when a finding appears that is not in
        # tools/replay-baseline.json; a shrinking set is allowed (#139).
        run: |
          ./target/release/replay \
            --manifest /tmp/selftest-corpus/manifest.jsonl \
            --programs /tmp/selftest-corpus/programs \
            --baseline tools/replay-baseline.json \
            --json /tmp/replay-report.json \
            --gate

      - name: Upload the replay report
        uses: actions/upload-artifact@v4
        with:
          name: replay-report
          path: /tmp/replay-report.json
          if-no-files-found: error

  diff:
    name: Kernel differential check
    # hosted runners have passwordless sudo and run directly in a VM, so
    # `sudo` provides the capabilities for the raw bpf() syscall. Do NOT
    # switch this to a container: job — Docker's default seccomp profile
    # blocks the bpf() syscall entirely.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the binaries
        run: cargo build --bin diff --bin fuzz --bin reduce

      - name: Run the differential harness
        # build as the runner user, run only the binary as root —
        # sudo resets PATH (secure_path) and HOME, which would hide
        # cargo/rustup from root. Exits 1 on non-whitelisted
        # kernel-accepts findings (src/diff.rs, docs/DIFFERENTIAL_PLAN.md §10)
        run: sudo ./target/debug/diff -- --json /tmp/diff.json

      - name: Upload the diff report
        uses: actions/upload-artifact@v4
        with:
          name: diff-report
          path: /tmp/diff.json
          if-no-files-found: error

      - name: Run a short kernel-backed fuzz campaign
        # same exit contract as the diff harness: a non-whitelisted
        # finding (precision/soundness candidate, rv gap/bug) fails CI
        # so a discovered candidate never goes unnoticed (#73)
        run: sudo ./target/debug/fuzz --seed 7 --iters 50 --kernel --out-dir /tmp/fuzz-kernel

      - name: Upload the kernel campaign artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-kernel
          path: /tmp/fuzz-kernel/
          if-no-files-found: error

  fuzz:
    name: Fuzzer smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the fuzz binary
        run: cargo build --bin fuzz --bin reduce

      - name: Run the fuzzer regression suite
        # fixed-seed determinism, classification invariants, opcode
        # coverage, finding replay — all without a bpf() syscall (#72)
        # (quoted: YAML would parse the ':: ' in 'fuzz:: --lib' as a mapping)
        run: "cargo test fuzz:: --lib"

      - name: Reduce the unprivileged verdict-flip fixture
        # kernel-independent finding (mini + concrete only); exits 1 on
        # a classification change (reducer bug) (#83)
        run: ./target/debug/reduce tests/data/reduce/verdict-flip-mseed-5-3 --out-dir /tmp/reduce-out

      - name: Upload the reduced verdict-flip artifact
        uses: actions/upload-artifact@v4
        with:
          name: reduce-unprivileged
          path: /tmp/reduce-out/
          if-no-files-found: error

      - name: Run an unprivileged smoke campaign
        # kernel columns are skipped without privileges; exits 1 only
        # on a non-whitelisted finding (e.g. a rand-verifier model bug)
        run: ./target/debug/fuzz --seed 42 --iters 200 --out-dir /tmp/fuzz-out

      - name: Upload the campaign summary
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-summary
          path: /tmp/fuzz-out/summary.json
          if-no-files-found: error

  drift:
    name: Drift check (bpf-next 7.2.0-rc6 baseline)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the drift tool
        run: cargo build --bin drift

      - name: Compare mini verdicts and state counts against the baseline
        # The kernel side of the baseline is recorded in the bpf-next
        # qemu guest (tools/drift-baseline/); the CI re-verifies the
        # deterministic mini side on every push and exits 1 on a
        # verdict flip or a checkpoint-count change (#102).
        run: |
          ./target/debug/drift --record --mini-only /tmp/drift-ci.json
          ./target/debug/drift --compare tools/drift-baseline/v0.9-bpfnext-7.2.0-rc6.json --new /tmp/drift-ci.json

      - name: Upload the drift report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: /tmp/drift-ci.json
          if-no-files-found: error
